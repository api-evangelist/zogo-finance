name: Zogo Finance
description: >-
  Zogo Finance is a gamified financial education platform (founded 2018, a
  Techstars portfolio company) that helps banks, credit unions, and other
  financial institutions engage and educate their customers. Its library of
  1,200+ bite-sized financial literacy modules is delivered to end users through
  an embeddable, white-label SDK that partners drop into their existing digital
  banking apps and websites, plus a standalone mobile app and desktop web
  experience. Users earn redeemable points for completing lessons. Zogo is a
  B2B/enterprise offering distributed via SDK embed and mobile-banking
  integrations (Q2, NCR, Jack Henry Banno) rather than a public developer API;
  as of this pass no public API documentation, OpenAPI specification, or
  developer portal is published.
